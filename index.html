<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体素沙盒 · Cesium</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a3050; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // Cesium 运行时资产路径: 本地开发用 dev server 的 /cesium, 线上部署在 /voxel/cesium
    window.CESIUM_BASE_URL =
      (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
        ? '/cesium'
        : '/voxel/cesium';
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
